<!DOCTYPE html>
<html>
<head>
  <title>QuickRide - Book Your Ride</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white; min-height: 100vh;
    }

    /* Auth Box */
    .authBox { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 99999;
    }
    .authCard {
      background: linear-gradient(135deg, #1e293b, #0f172a); padding: 40px; border-radius: 28px;
      text-align: center; border: 1px solid rgba(16, 163, 127, 0.3); max-width: 400px; width: 90%;
    }
    .googleBtn { 
      background: white; color: black; width: 100%; padding: 14px; border: none; 
      border-radius: 35px; font-weight: 700; cursor: pointer; margin-top: 20px; font-size: 16px; 
    }

    /* Header */
    .header {
      background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(20px);
      padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; 
      position: sticky; top: 0; z-index: 100;
    }
    .userInfo { display: flex; align-items: center; gap: 10px; }
    .userInfo img { width: 35px; height: 35px; border-radius: 50%; }
    .logoutBtn { background: #ef4444; border: none; padding: 8px 16px; border-radius: 20px; color: white; cursor: pointer; }

    /* Content Layout */
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .sectionTitle { margin: 20px 0 10px; color: #10a37f; }

    /* Cars Grid */
    .carsGrid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;
    }
    .carCard {
      background: #1e293b; border-radius: 15px; overflow: hidden; border: 1px solid #334155;
    }
    .carImg { width: 100%; height: 180px; object-fit: cover; }
    .carInfo { padding: 15px; }
    .bookBtn {
      background: #10a37f; color: white; border: none; width: 100%; padding: 10px;
      border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px;
    }

    /* Booking Modal Form */
    .modal {
      display: none; position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000;
    }
    .modalContent {
      background: #1e293b; padding: 30px; border-radius: 20px; width: 90%; max-width: 450px;
    }
    .modalContent input {
      width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none;
      background: #111827; color: white; outline: none;
    }
    .modalContent button {
      width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight:700; cursor:pointer;
    }

    /* Bookings Table */
    table {
      width: 100%; background: #1e293b; border-radius: 15px; overflow: hidden;
      border-collapse: collapse; margin-top: 15px;
    }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #0f172a; }
    .status { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 700; }
    .pending { background: #f59e0b; color: black; }
    .confirmed { background: #10a37f; color: white; }
    .cancelled { background: #ef4444; color: white; }
  </style>
</head>
<body>

  <div class="authBox" id="authBox">
    <div class="authCard">
      <h2>🚗 QuickRide User Panel</h2>
      <p style="color: #94a3b8; margin-top: 5px;">Sign in to Book a Car</p>
      <button class="googleBtn" onclick="userLogin()">Sign In With Google</button>
    </div>
  </div>

  <div id="mainApp" style="display:none;">
    <div class="header">
      <h2>🚗 QuickRide</h2>
      <div class="userInfo">
        <img id="userPhoto" src="" alt="User Profile">
        <div>
          <div id="userName" style="font-size:14px; font-weight: 600;"></div>
          <button class="logoutBtn" onclick="userLogout()">Logout</button>
        </div>
      </div>
    </div>

    <div class="container">
      <h3 class="sectionTitle">📋 Your Bookings</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Car Name</th>
              <th>Route</th>
              <th>Status</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="userBookingsTable">
            <tr><td colspan="4" style="text-align:center;">No bookings found.</td></tr>
          </tbody>
        </table>
      </div>

      <h3 class="sectionTitle">🚗 Available Cars For Rent</h3>
      <div class="carsGrid" id="userCarsGrid"></div>
    </div>
  </div>

  <div class="modal" id="bookingModal">
    <div class="modalContent">
      <h3 style="color: #10a37f;">Confirm Your Booking</h3>
      <p id="modalCarName" style="margin: 5px 0 15px; color:#94a3b8;"></p>
      <input type="text" id="pickupLoc" placeholder="Pickup Location (Minimum 3 chars)">
      <input type="text" id="dropLoc" placeholder="Drop Location (Minimum 3 chars)">
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button onclick="submitBooking()" style="background: #10a37f; color: white;">Confirm Booking</button>
        <button onclick="closeModal()" style="background: #ef4444; color: white;">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { getDatabase, ref, set, get, push, onValue, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

    // Tomar system configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBySOEfSbkpl4csyqckfX-kLeIoD-85VYs",
      authDomain: "my-friend-hub.firebaseapp.com",
      databaseURL: "https://my-friend-hub-default-rtdb.asia-southeast1.firebasestorage.app",
      projectId: "my-friend-hub",
      storageBucket: "my-friend-hub.firebasestorage.app",
      messagingSenderId: "1084141933087",
      appId: "1:1084141933087:web:1ae757acdd37a9c8427b2a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let selectedCar = null;

    // Google Login popup based setup
    window.userLogin = async () => {
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert("Login Error: " + err.message);
      }
    };

    // Logout
    window.userLogout = () => { signOut(auth); };

    // Core Auth Watcher
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById("authBox").style.display = "none";
        document.getElementById("mainApp").style.display = "block";
        document.getElementById("userName").textContent = user.displayName;
        document.getElementById("userPhoto").src = user.photoURL || "https://via.placeholder.com/35";
        
        // Rules validation mapping track user database entry profiles
        await set(ref(db, 'users/' + user.uid), {
          name: user.displayName,
          email: user.email
        });

        loadAvailableCars();
        loadUserBookings();
      } else {
        currentUser = null;
        document.getElementById("authBox").style.display = "flex";
        document.getElementById("mainApp").style.display = "none";
      }
    });

    // Fetch and display active vehicles
    function loadAvailableCars() {
      onValue(ref(db, 'cars'), (snap) => {
        const grid = document.getElementById("userCarsGrid");
        grid.innerHTML = "";
        const cars = snap.val() || {};
        
        if(Object.keys(cars).length === 0) {
          grid.innerHTML = "<p>No cars available at this moment.</p>";
          return;
        }

        for (const [key, car] of Object.entries(cars)) {
          grid.innerHTML += `
            <div class="carCard">
              <img src="${car.image || 'https://via.placeholder.com/300x180'}" class="carImg">
              <div class="carInfo">
                <h3>${car.name}</h3>
                <p style="color: #94a3b8; margin: 5px 0;">₹${car.price}/day | ${car.seats} Seats</p>
                <p style="font-size: 13px; color: #10a37f;">Fuel: ${car.fuel} | Type: ${car.ac ? 'AC' : 'Non-AC'}</p>
                <button class="bookBtn" onclick="openBookingModal('${key}', '${car.name}')">Book Now</button>
              </div>
            </div>
          `;
        }
      });
    }

    // Modal Operations
    window.openBookingModal = (carId, carName) => {
      selectedCar = { id: carId, name: carName };
      document.getElementById("modalCarName").textContent = carName;
      document.getElementById("bookingModal").style.display = "flex";
    };

    window.closeModal = () => {
      document.getElementById("bookingModal").style.display = "none";
    };

    // Booking Submission Logic (Matching Firebase Validation Rules)
    window.submitBooking = async () => {
      const pLoc = document.getElementById("pickupLoc").value.trim();
      const dLoc = document.getElementById("dropLoc").value.trim();

      if(pLoc.length <= 2 || dLoc.length <= 2) {
        return alert("Location minimum 3 letters er hote hobe!");
      }

      const bookingPayload = {
        userId: currentUser.uid,
        carId: selectedCar.id,
        carName: selectedCar.name,
        pickupLocation: pLoc,
        dropLocation: dLoc,
        status: "pending",               // Strict Rule matching default mapping status
        timestamp: Date.now()            // Strict validation rules matched schema
      };

      try {
        await push(ref(db, 'bookings'), bookingPayload);
        alert("Booking request submitted successfully!");
        closeModal();
        document.getElementById("pickupLoc").value = "";
        document.getElementById("dropLoc").value = "";
      } catch (err) {
        alert("Booking failed: Security check rejected. " + err.message);
      }
    };

    // User-specific queries to load personalized lists (Secure filtration tracking rules mapping)
    function loadUserBookings() {
      onValue(ref(db, 'bookings'), (snap) => {
        const tbody = document.getElementById("userBookingsTable");
        tbody.innerHTML = "";
        const bookings = snap.val() || {};
        let count = 0;

        for (const [key, booking] of Object.entries(bookings)) {
          // Client filtration security boundary setup
          if(booking.userId === currentUser.uid) {
            count++;
            tbody.innerHTML += `
              <tr>
                <td><b>${booking.carName}</b></td>
                <td>📍 ${booking.pickupLocation} → ${booking.dropLocation}</td>
                <td><span class="status ${booking.status}">${booking.status.toUpperCase()}</span></td>
                <td>${new Date(booking.timestamp).toLocaleString()}</td>
              </tr>
            `;
          }
        }
        if(count === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No bookings requested yet.</td></tr>`;
        }
      });
    }
  </script>
</body>
</html>
