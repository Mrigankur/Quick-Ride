<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QuickRide - Book Your Car</title>
  <link rel="stylesheet" href="user.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 🔐 Login Screen -->
  <div id="loginScreen" class="auth-container">
    <div class="auth-card">
      <h1 class="logo">🚗 QuickRide</h1>
      <p>Sign in to book your ride</p>
      <button id="googleLoginBtn" class="google-btn">
        <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google"> 
        Continue with Google
      </button>
    </div>
  </div>

  <!-- 📱 Main App (Hidden before login) -->
  <div id="mainApp" style="display: none;">
    
    <!-- Header -->
    <header class="app-header">
      <div class="logo">🚗 QuickRide</div>
      <div class="user-profile-mini">
        <img id="headerUserImg" src="https://via.placeholder.com/40" alt="User">
      </div>
    </header>

    <!-- Content Area -->
    <main class="app-content">
      
      <!-- 🏠 TAB 1: HOME (Available Cars) -->
      <section id="tab-home" class="tab-section active">
        <div class="banner">
          <h2>Premium Rides,<br>Affordable Prices</h2>
        </div>
        <h3 class="section-title">Available Cars</h3>
        <div id="carsGrid" class="cars-grid">
          <!-- Cars will be loaded here via JS -->
        </div>
      </section>

      <!-- 📅 TAB 2: BOOKINGS (User's Orders) -->
      <section id="tab-bookings" class="tab-section">
        <h3 class="section-title">My Orders</h3>
        <div id="bookingsList" class="bookings-list">
          <!-- User Bookings will be loaded here via JS -->
        </div>
      </section>

      <!-- 👤 TAB 3: ACCOUNT (Profile) -->
      <section id="tab-account" class="tab-section">
        <div class="account-card">
          <img id="accountUserImg" src="https://via.placeholder.com/90" alt="Profile">
          <h2 id="accountUserName">User Name</h2>
          <p id="accountUserEmail">user@email.com</p>
          <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
      </section>

    </main>

    <!-- 🔽 Mobile Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button class="nav-item active" onclick="switchTab('home', this)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span>Home</span>
      </button>
      <button class="nav-item" onclick="switchTab('bookings', this)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
        <span>Bookings</span>
      </button>
      <button class="nav-item" onclick="switchTab('account', this)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span>Account</span>
      </button>
    </nav>

  </div>

  <!-- 📝 Booking Modal -->
  <div id="bookingModal" class="modal-overlay">
    <div class="modal-card">
      <h3>Confirm Booking</h3>
      <p id="modalCarName" class="highlight-text"></p>
      
      <div class="input-group">
        <input type="tel" id="userPhone" placeholder="📱 Phone Number (10 digits)">
        <input type="text" id="pickupLoc" placeholder="📍 Pickup Location">
        <input type="text" id="dropLoc" placeholder="🏁 Drop Location">
      </div>
      
      <div class="payment-info">
        <strong>💵 Cash on Delivery</strong>
        <p>Pay offline directly to the driver after your ride.</p>
      </div>

      <div class="modal-actions">
        <button id="cancelBookingBtn" class="btn-secondary">Cancel</button>
        <button id="confirmBookingBtn" class="btn-primary">Confirm Booking</button>
      </div>
    </div>
  </div>

  <!-- Load JS -->
  <script type="module" src="user.js"></script>
  
  <!-- Global Tab Function -->
  <script>
    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-section').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      element.classList.add('active');
    }
  </script>
</body>
</html>
