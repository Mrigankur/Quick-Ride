<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick-Ride - Book Your Car</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Auth / Login Screen -->
    <div id="authContainer" class="auth-container">
        <div class="auth-card">
            <div class="logo">🚗 Quick-Ride</div>
            <p>Sign in to book your favorite rides instantly</p>
            <button class="google-btn" onclick="handleGoogleLogin()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Continue with Google
            </button>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="appContainer" style="display: none;">
        <header class="app-header">
            <div class="logo" style="margin: 0; font-size: 20px;">🚗 Quick-Ride</div>
            <div class="user-profile-mini">
                <img id="userMiniAvatar" src="https://via.placeholder.com/35" alt="User">
            </div>
        </header>

        <main class="app-content">
            <!-- Home Tab -->
            <section id="homeTab" class="tab-section active">
                <div class="banner">
                    <h2>Premium Rides,<br>Affordable Prices</h2>
                </div>
                <div class="section-title">Available Cars</div>
                <div class="cars-grid" id="carsGrid"></div>
            </section>

            <!-- Bookings Tab -->
            <section id="bookingsTab" class="tab-section">
                <div class="section-title">My Orders</div>
                <div class="bookings-list" id="bookingsList"></div>
            </section>

            <!-- Account Tab -->
            <section id="accountTab" class="tab-section">
                <div class="account-card">
                    <img id="userAvatar" src="https://via.placeholder.com/90" alt="User">
                    <h2 id="userName">User Name</h2>
                    <p id="userEmail">user@email.com</p>
                    <button class="logout-btn" onclick="handleLogout()">Logout</button>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('home', this)"><span>Home</span></button>
            <button class="nav-item" onclick="switchTab('bookings', this)"><span>Bookings</span></button>
            <button class="nav-item" onclick="switchTab('account', this)"><span>Account</span></button>
        </nav>
    </div>

    <!-- Booking Modal -->
    <div id="bookingModal" class="modal-overlay">
        <div class="modal-card">
            <h3>Confirm Booking</h3>
            <p id="modalCarName" class="highlight-text">Car Name</p>
            <div class="input-group">
                <input type="text" id="phoneInput" placeholder="Phone Number">
                <input type="text" id="pickupInput" placeholder="Pickup Location">
                <input type="text" id="dropInput" placeholder="Drop Location">
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeBookingModal()">Cancel</button>
                <button class="btn-primary" onclick="confirmBooking()">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Firebase & App Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, doc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBySOEfSbkpl4csyqckfX-kLeIoD-85VYs",
            authDomain: "my-friend-hub.firebaseapp.com",
            databaseURL: "https://my-friend-hub-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "my-friend-hub",
            storageBucket: "my-friend-hub.firebasestorage.app",
            messagingSenderId: "1084141933087",
            appId: "1:1084141933087:web:1ae757acdd37a9c8427b2a",
            measurementId: "G-6E10B7M7WZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let selectedCarId = null;
        let selectedCarData = null;

        window.handleGoogleLogin = () => signInWithPopup(auth, new GoogleAuthProvider());
        window.handleLogout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authContainer').style.display = 'none';
                document.getElementById('appContainer').style.display = 'block';
                document.getElementById('userName').innerText = user.displayName;
                document.getElementById('userEmail').innerText = user.email;
                document.getElementById('userAvatar').src = user.photoURL;
                document.getElementById('userMiniAvatar').src = user.photoURL;
                setupRealtimeCars();
                setupRealtimeBookings();
            } else {
                document.getElementById('appContainer').style.display = 'none';
                document.getElementById('authContainer').style.display = 'flex';
            }
        });

        function setupRealtimeCars() {
            const carsGrid = document.getElementById('carsGrid');
            onSnapshot(collection(db, "cars"), (snapshot) => {
                carsGrid.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const car = docSnap.data();
                    const carId = docSnap.id;
                    carsGrid.innerHTML += `
                        <div class="car-card">
                            <img src="${car.image}" class="car-img" alt="Car">
                            <div class="car-details">
                                <div class="car-title">${car.name}</div>
                                <div class="car-price">$${car.price}<span>/day</span></div>
                                <p style="font-size: 13px; color: #555; margin-bottom: 8px;">Stock: <strong>${car.quantity || 1}</strong></p>
                                <button class="book-btn" onclick="openBookingModal('${carId}', '${car.name}')">Book Now</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        window.openBookingModal = function(id, name) {
            selectedCarId = id;
            selectedCarData = { name };
            document.getElementById('modalCarName').innerText = name;
            document.getElementById('bookingModal').style.display = 'flex';
        }

        window.closeBookingModal = () => document.getElementById('bookingModal').style.display = 'none';

        window.confirmBooking = async function() {
            const phone = document.getElementById('phoneInput').value;
            const pickup = document.getElementById('pickupInput').value;
            const drop = document.getElementById('dropInput').value;

            if(!phone || !pickup || !drop) return alert('Fill all fields!');

            try {
                await addDoc(collection(db, "bookings"), {
                    userId: currentUser.uid,
                    userName: currentUser.displayName,
                    carId: selectedCarId,
                    carName: selectedCarData.name,
                    phone, pickup, drop,
                    status: 'Pending',
                    createdAt: new Date()
                });

                const carRef = doc(db, "cars", selectedCarId);
                const carSnap = await getDoc(carRef);
                if(carSnap.exists()) {
                    let currentQty = carSnap.data().quantity || 1;
                    if(currentQty > 1) {
                        await updateDoc(carRef, { quantity: currentQty - 1 });
                    } else {
                        await deleteDoc(carRef); // অটো রিমুভ স্টক শেষ হলে
                    }
                }

                alert('Booking Confirmed Successfully!');
                closeBookingModal();
                switchTab('bookings', document.querySelectorAll('.nav-item')[1]);
            } catch(e) {
                console.error(e);
            }
        }

        function setupRealtimeBookings() {
            const bookingsList = document.getElementById('bookingsList');
            const q = query(collection(db, "bookings"), where("userId", "==", currentUser.uid));
            onSnapshot(q, (snapshot) => {
                bookingsList.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const b = docSnap.data();
                    bookingsList.innerHTML += `
                        <div class="order-card">
                            <div class="order-header">
                                <span class="order-title">${b.carName}</span>
                                <span class="order-status status-${b.status.toLowerCase()}">${b.status}</span>
                            </div>
                            <div class="order-details">
                                <p><strong>Route:</strong> ${b.pickup} ➔ ${b.drop}</p>
                            </div>
                        </div>
                    `;
                });
            });
        }

        window.switchTab = function(tabName, element) {
            document.querySelectorAll('.tab-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById(tabName + 'Tab').classList.add('active');
            element.classList.add('active');
        }
    </script>
</body>
</html>
