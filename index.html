<!DOCTYPE html>
<html>
<head>
  <title>QuickRide - Book Your Ride</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3097/3097180.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white; min-height: 100vh;
      overflow-x: hidden;
    }
    
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

    .authBox { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);
      display: flex; justify-content: center; align-items: center; z-index: 99999;
    }
    .authCard {
      background: rgba(30, 41, 59, 0.9); padding: 40px; border-radius: 28px;
      text-align: center; border: 1px solid rgba(16, 163, 127, 0.5); 
      max-width: 400px; width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    
    .googleBtn { 
      background: white; color: black; width: 100%; padding: 14px; border: none; 
      border-radius: 35px; font-weight: 700; cursor: pointer; margin-top: 25px; font-size: 16px; 
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all 0.3s ease;
    }
    .googleBtn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,255,255,0.2); }
    
    .header {
      background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(15px);
      padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; 
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .userInfo { display: flex; align-items: center; gap: 15px; }
    .userInfo img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #10a37f; }
    .logoutBtn { background: transparent; border: 1px solid #ef4444; padding: 6px 15px; border-radius: 20px; color: #ef4444; cursor: pointer; transition: 0.3s; }
    .logoutBtn:hover { background: #ef4444; color: white; }
    
    .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; animation: fadeInUp 0.8s ease; }
    .sectionTitle { margin: 30px 0 20px; color: #10a37f; font-size: 22px; }
    
    .carsGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
    .carCard { 
      background: #1e293b; border-radius: 20px; overflow: hidden; 
      border: 1px solid #334155; transition: all 0.4s ease;
    }
    .carCard:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(16, 163, 127, 0.2); border-color: #10a37f; }
    .carImg { width: 100%; height: 200px; object-fit: cover; transition: transform 0.4s ease; }
    .carCard:hover .carImg { transform: scale(1.05); }
    .carInfo { padding: 20px; }
    
    .bookBtn { 
      background: linear-gradient(135deg, #10a37f, #059669); color: white; border: none; 
      width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; 
      margin-top: 15px; transition: 0.3s; font-size: 16px;
    }
    .bookBtn:hover { box-shadow: 0 8px 15px rgba(16, 163, 127, 0.4); transform: scale(1.02); }
    
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 1000; }
    .modalContent { 
      background: #1e293b; padding: 35px; border-radius: 24px; width: 90%; max-width: 450px; 
      border: 1px solid rgba(16, 163, 127, 0.4); box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      animation: popIn 0.4s ease forwards;
    }
    .modalContent input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; transition: 0.3s; }
    .modalContent input:focus { border-color: #10a37f; box-shadow: 0 0 10px rgba(16, 163, 127, 0.2); }
    
    .paymentBox { background:rgba(16, 163, 127, 0.1); padding:15px; border-radius:12px; margin:20px 0; border:1px dashed #10a37f; text-align: center; }
    .modalContent button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight:700; cursor:pointer; font-size: 16px; transition: 0.3s; }
    .modalContent button:hover { transform: translateY(-2px); }
    
    table { width: 100%; background: #1e293b; border-radius: 15px; overflow: hidden; border-collapse: collapse; margin-top: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    th, td { padding: 18px 15px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #0f172a; color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 13px; }
    tr:hover { background: rgba(255,255,255,0.02); }
    .status { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .pending { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid #f59e0b; }
    .confirmed { background: rgba(16, 163, 127, 0.2); color: #6ee7b7; border: 1px solid #10a37f; }
    .cancelled { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
  </style>
</head>
<body>

  <div class="authBox" id="authBox">
    <div class="authCard">
      <h2 style="font-size: 28px; color: #10a37f;">🚗 QuickRide</h2>
      <p style="color: #94a3b8; margin-top: 10px;">Sign in to Book a Car</p>
      <button class="googleBtn" onclick="userLogin()">
        <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" style="width:20px;" alt="G"> 
        Sign In With Google
      </button>
    </div>
  </div>

  <div id="mainApp" style="display:none;">
    <div class="header">
      <h2 style="color: #10a37f; margin: 0;">🚗 QuickRide</h2>
      <div class="userInfo">
        <div style="text-align: right;">
          <div id="userName" style="font-size:15px; font-weight: 600;"></div>
          <button class="logoutBtn" onclick="userLogout()">Logout</button>
        </div>
        <img id="userPhoto" src="" alt="Profile">
      </div>
    </div>

    <div class="container">
      <h3 class="sectionTitle">📋 My Bookings</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Car Name</th>
              <th>Route Details</th>
              <th>Payment Info</th>
              <th>Status</th>
              <th>Date & Time</th>
            </tr>
          </thead>
          <tbody id="userBookingsTable">
            <tr><td colspan="5" style="text-align:center; padding: 30px; color:#94a3b8;">No bookings found. Start booking!</td></tr>
          </tbody>
        </table>
      </div>

      <h3 class="sectionTitle" style="margin-top: 50px;">🚗 Available Cars For Rent</h3>
      <div class="carsGrid" id="userCarsGrid"></div>
    </div>
  </div>

  <div class="modal" id="bookingModal">
    <div class="modalContent">
      <h2 style="color: white; text-align:center; margin-bottom:5px;">Confirm Booking</h2>
      <p id="modalCarName" style="text-align:center; color:#10a37f; font-weight:bold; margin-bottom:20px;"></p>
      
      <input type="tel" id="userPhone" placeholder="📱 Enter Your Phone Number">
      <input type="text" id="pickupLoc" placeholder="📍 Pickup Location (Min 3 chars)">
      <input type="text" id="dropLoc" placeholder="🏁 Drop Location (Min 3 chars)">
      
      <div class="paymentBox">
        <h4 style="color:#10a37f; margin-bottom:5px;">💵 Cash on Delivery</h4>
        <p style="font-size:12px; color:#cbd5e1; margin:0;">Pay offline directly to the driver after your ride.</p>
      </div>

      <div style="display: flex; gap: 15px; margin-top: 20px;">
        <button onclick="submitBooking()" style="background: linear-gradient(135deg, #10a37f, #059669); color: white; flex: 2;">Confirm</button>
        <button onclick="closeModal()" style="background: transparent; border: 1px solid #ef4444; color: #ef4444; flex: 1;">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBySOEfSbkpl4csyqckfX-kLeIoD-85VYs",
      authDomain: "my-friend-hub.firebaseapp.com",
      databaseURL: "https://my-friend-hub-default-rtdb.asia-southeast1.firebasestorage.app",
      projectId: "my-friend-hub",
      storageBucket: "my-friend-hub.firebasestorage.app",
      messagingSenderId: "1084141933087",
      appId: "1:1084141933087:web:1ae757acdd37a9c8427b2a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let selectedCar = null;

    window.userLogin = async () => {
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert("Login Error: " + err.message);
      }
    };

    window.userLogout = () => { signOut(auth); };

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById("authBox").style.display = "none";
        document.getElementById("mainApp").style.display = "block";
        document.getElementById("userName").textContent = user.displayName;
        document.getElementById("userPhoto").src = user.photoURL || "https://via.placeholder.com/40";
        
        await set(ref(db, 'users/' + user.uid), {
          name: user.displayName,
          email: user.email
        });

        loadAvailableCars();
        loadUserBookings();
      } else {
        currentUser = null;
        document.getElementById("authBox").style.display = "flex";
        document.getElementById("mainApp").style.display = "none";
      }
    });

    function loadAvailableCars() {
      onValue(ref(db, 'cars'), (snap) => {
        const grid = document.getElementById("userCarsGrid");
        grid.innerHTML = "";
        const cars = snap.val() || {};
        
        if(Object.keys(cars).length === 0) {
          grid.innerHTML = "<p style='color:#94a3b8;'>No cars available at this moment.</p>";
          return;
        }

        for (const [key, car] of Object.entries(cars)) {
          if (parseInt(car.quantity) > 0) {
            grid.innerHTML += `
              <div class="carCard">
                <img src="${car.image || 'https://via.placeholder.com/300x180'}" class="carImg">
                <div class="carInfo">
                  <h3 style="font-size:18px; margin-bottom:8px;">${car.name}</h3>
                  <p style="color: #cbd5e1; font-size:14px; margin-bottom:5px;">💰 ₹${car.price}/day | 💺 ${car.seats} Seats</p>
                  <p style="font-size: 13px; color: #10a37f;">⛽ Fuel: ${car.fuel} | ❄️ ${car.ac}</p>
                  <button class="bookBtn" onclick="openBookingModal('${key}', '${car.name}')">Book Now</button>
                </div>
              </div>
            `;
          }
        }
      });
    }

    window.openBookingModal = (carId, carName) => {
      selectedCar = { id: carId, name: carName };
      document.getElementById("modalCarName").textContent = carName;
      document.getElementById("bookingModal").style.display = "flex";
    };

    window.closeModal = () => {
      document.getElementById("bookingModal").style.display = "none";
    };

    window.submitBooking = async () => {
      const uPhone = document.getElementById("userPhone").value.trim();
      const pLoc = document.getElementById("pickupLoc").value.trim();
      const dLoc = document.getElementById("dropLoc").value.trim();

      if(!uPhone || pLoc.length <= 2 || dLoc.length <= 2) {
        return alert("Please fill all details correctly! Locations must be min 3 chars.");
      }

      const bookingPayload = {
        userId: currentUser.uid,
        userName: currentUser.displayName,
        userPhone: uPhone,
        carId: selectedCar.id,
        carName: selectedCar.name,
        pickupLocation: pLoc,
        dropLocation: dLoc,
        paymentMethod: "Cash on Delivery",
        status: "pending",
        timestamp: Date.now()
      };

      try {
        await push(ref(db, 'bookings'), bookingPayload);
        alert("✅ Booking Success! Driver will contact you.");
        closeModal();
        document.getElementById("userPhone").value = "";
        document.getElementById("pickupLoc").value = "";
        document.getElementById("dropLoc").value = "";
      } catch (err) {
        alert("Booking failed: " + err.message);
      }
    };

    function loadUserBookings() {
      const userBookingsQuery = query(ref(db, 'bookings'), orderByChild('userId'), equalTo(currentUser.uid));
      
      onValue(userBookingsQuery, (snap) => {
        const tbody = document.getElementById("userBookingsTable");
        tbody.innerHTML = "";
        const bookings = snap.val() || {};
        let count = 0;

        for (const [key, booking] of Object.entries(bookings)) {
          count++;
          tbody.innerHTML += `
            <tr>
              <td style="color:white;"><b>${booking.carName}</b></td>
              <td>📍 ${booking.pickupLocation}<br>🏁 ${booking.dropLocation}</td>
              <td>💵 ${booking.paymentMethod}</td>
              <td><span class="status ${booking.status}">${booking.status.toUpperCase()}</span></td>
              <td style="color:#94a3b8;">${new Date(booking.timestamp).toLocaleString()}</td>
            </tr>
          `;
        }
        if(count === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 30px; color:#94a3b8;">No bookings requested yet.</td></tr>`;
        }
      });
    }
  </script>
</body>
</html>
