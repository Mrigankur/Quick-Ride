/* ================= LOGIN ================= */

top:0;
left:0;

width:100%;
height:100%;

display:flex;

justify-content:center;

.popup{

.loginBtn{

.detectBtn{

/* ================= AI CHAT ================= */

right:20px;

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {

getAuth,
GoogleAuthProvider,
signInWithPopup

}
from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {

getDatabase,
ref,
push

}
from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:
"YOUR_API_KEY",

authDomain:
"YOUR_PROJECT.firebaseapp.com",

databaseURL:
"YOUR_DATABASE_URL",

projectId:
"YOUR_PROJECT_ID",

storageBucket:
"YOUR_STORAGE",

messagingSenderId:
"YOUR_SENDER_ID",

appId:
"YOUR_APP_ID"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);

/* ================= LOCATION ================= */

let userLocation = {

lat:22.5726,
lng:88.3639

};

/* AUTO LOCATION */

window.detectLocation =
function(){

navigator.geolocation
.getCurrentPosition(

(position)=>{

userLocation.lat =
position.coords.latitude;

userLocation.lng =
position.coords.longitude;

alert(
"📍 Location detected"
);

initMap();

},

()=>{

alert(
"Location permission denied"
);

}

);

};

/* MANUAL LOCATION */

document
.getElementById("manualLocation")
.addEventListener(
"change",

function(){

let city =
this.value;

if(city==="Kolkata"){

userLocation = {

lat:22.5726,
lng:88.3639

};

}

if(city==="Cooch Behar"){

userLocation = {

lat:26.3452,
lng:89.4482

};

}

if(city==="Delhi"){

userLocation = {

lat:28.6139,
lng:77.2090

};

}

if(city==="Mumbai"){

userLocation = {

lat:19.0760,
lng:72.8777

};

}

initMap();

});

/* ================= MAP ================= */

let map;

let marker;

function initMap(){

map =
new google.maps.Map(

document.getElementById("map"),

{
zoom:13,
center:userLocation
}

);

marker =
new google.maps.Marker({

position:userLocation,

map:map,

title:"Quick Ride Driver"

});

/* LIVE DRIVER */

setInterval(()=>{

userLocation.lat +=
(Math.random()-0.5)*0.001;

userLocation.lng +=
(Math.random()-0.5)*0.001;

marker.setPosition(userLocation);

map.panTo(userLocation);

},3000);

}

window.onload = initMap;

/* ================= LOGIN ================= */

window.realLogin =
async function(){

const provider =
new GoogleAuthProvider();

try{

const result =
await signInWithPopup(
auth,
provider
);

document
.getElementById("userStatus")
.innerText =
result.user.displayName;

document
.getElementById("userPhoto")
.src =
result.user.photoURL;

localStorage.setItem(
"user",
result.user.uid
);

document
.getElementById("loginOverlay")
.style.display =
"none";

alert(
"Welcome " +
result.user.displayName
);

}

catch(error){

alert(error.message);

}

};

/* ================= CARS ================= */

const cars = [

{
name:"BMW X5",
price:"₹25/km",
rating:"⭐ 4.9",
image:"https://cdn.pixabay.com/photo/2016/11/29/03/53/automobile-1868726_1280.jpg"
},

{
name:"Mercedes C-Class",
price:"₹28/km",
rating:"⭐ 4.8",
image:"https://cdn.pixabay.com/photo/2017/03/27/14/56/car-2179220_1280.jpg"
},

{
name:"Toyota Innova",
price:"₹18/km",
rating:"⭐ 4.7",
image:"https://cdn.pixabay.com/photo/2012/05/29/00/43/car-49278_1280.jpg"
},

{
name:"Audi A6",
price:"₹24/km",
rating:"⭐ 4.8",
image:"https://cdn.pixabay.com/photo/2016/12/27/21/03/lamborghini-1930434_1280.jpg"
}

];

const container =
document.getElementById("carContainer");

cars.forEach(car=>{

container.innerHTML += `

<div class="card">

<img src="${car.image}">

<div class="cardContent">

<h3>${car.name}</h3>

<div class="price">
${car.price}
</div>

<div class="rating">
${car.rating}
</div>

<button
class="reserveBtn"
onclick="reserveCar(
'${car.name}'
)">

Reserve Now

</button>

</div>

</div>

`;

});

/* ================= RESERVE ================= */

window.reserveCar =
function(car){

if(
!localStorage.getItem("user")
){

alert(
"⚠️ Login first"
);

return;

}

push(

ref(db,"bookings"),

{

car:car,

location:userLocation,

time:
new Date().toLocaleString()

}

);

alert(
"🚗 Reserved: " + car
);

document
.getElementById("historyBox")
.innerHTML += `

<div class="booking">

✅ ${car}
booked successfully

</div>

`;

};

/* ================= SEARCH ================= */

document
.getElementById("searchInput")
.addEventListener(
"keyup",

function(){

let value =
this.value.toLowerCase();

let cards =
document.querySelectorAll(".card");

let found = false;

cards.forEach(card=>{

let text =
card.innerText.toLowerCase();

if(
text.includes(value)
){

card.style.display =
"block";

found = true;

}

else{

card.style.display =
"none";

}

});

if(
value.length > 2 &&
!found
){

document
.getElementById("aiChat")
.style.display =
"flex";

addAIMessage(
"🤖 No car found. Ask me anything."
);

}

else{

document
.getElementById("aiChat")
.style.display =
"none";

}

});

/* ================= AI ================= */

function addAIMessage(text){

document
.getElementById("aiMessages")
.innerHTML += `

<div class="aiMsg">

${text}

</div>

`;

}

window.sendAI =
function(){

let input =
document.getElementById("aiInput");

let text =
input.value.toLowerCase();

if(!text) return;

addAIMessage(
"🧑 " + text
);

input.value = "";

setTimeout(()=>{

addAIMessage(`

🚗 Recommended Cars:

<br><br>

✅ BMW X5

<br>

✅ Mercedes C-Class

`);

},1000);

};

</script>

</body>

      Petrol
    </p>

    <p>
      Seats:
      4
    </p>

    <button
    class="reserveBtn"
    onclick="reserveCar(
    '${name} ${id}'
    )">

      Reserve Now

    </button>

    <button
    class="closeBtn"
    onclick="closePopup()">

      Close

    </button>

  `;

  document
  .getElementById("detailOverlay")
  .style.display="flex";

};

/* CLOSE */

window.closePopup =
function(){

  document
  .getElementById("detailOverlay")
  .style.display="none";

};

/* ================= RESERVE ================= */

window.reserveCar =
function(car){

  if(
  !localStorage
  .getItem("user")
  ){

    alert(
    "⚠️ Login first"
    );

    document
    .getElementById("loginOverlay")
    .style.display="flex";

    return;

  }

  alert(
  "🚗 Reserved: " + car
  );

  document
  .getElementById("historyBox")
  .innerHTML += `

    <div class="booking">

      ✅ ${car}
      booked successfully

    </div>

  `;

  closePopup();

};

/* ================= SEARCH ================= */

document
.getElementById("searchInput")
.addEventListener(
"keyup",

function(){

  let value =
  this.value.toLowerCase();

  let cards =
  document.querySelectorAll(".card");

  cards.forEach(card=>{

    let text =
    card.innerText.toLowerCase();

    card.style.display =
    text.includes(value)
    ? "block"
    : "none";

  });

});

/* ================= FILTER ================= */

document
.getElementById("filterSelect")
.addEventListener(
"change",

function(){

  let value =
  this.value;

  let cards =
  document.querySelectorAll(".card");

  cards.forEach(card=>{

    if(
    value==="all"
    ){

      card.style.display=
      "block";

    }

    else if(
    card.innerText
    .includes(value)
    ){

      card.style.display=
      "block";

    }

    else{

      card.style.display=
      "none";

    }

  });

});

</script>

</body>
</html>
